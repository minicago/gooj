<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - Gooj</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
    <script src="/static/common.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 24px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4CAF50, #81C784);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .user-info h1 {
            margin: 0 0 8px 0;
            color: #1f2937;
            font-size: 28px;
        }
        .user-meta {
            display: flex;
            gap: 16px;
            color: #6b7280;
            font-size: 14px;
            align-items: center;
        }
        .user-meta .rating {
            font-size: 20px;
            color: #f59e0b;
            font-weight: bold;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            color: #6b7280;
            margin-top: 4px;
            font-size: 14px;
        }
        .section {
            margin-bottom: 32px;
        }
        .section h2 {
            color: #1f2937;
            border-left: 4px solid #4CAF50;
            padding-left: 12px;
            margin-bottom: 16px;
            font-size: 18px;
        }
        .bio-container {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }
        .bio-editor {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        .bio-preview {
            background: white;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            min-height: 100px;
            line-height: 1.6;
        }
        .bio-preview h1, .bio-preview h2, .bio-preview h3 {
            margin-top: 0;
        }
        .bio-preview code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .bio-preview pre {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .bio-preview pre code {
            background: none;
            padding: 0;
        }
        .bio-preview .md-table {
            border-collapse: collapse;
            margin: 12px 0;
            width: auto;
            border: 1px solid #d1d5db;
        }
        .bio-preview .md-table td,
        .bio-preview .md-table th {
            border: 1px solid #d1d5db;
            padding: 8px 12px;
        }
        .bio-preview .md-table tr:first-child td {
            background: #f3f4f6;
            font-weight: bold;
        }
        .bio-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .bio-tab {
            padding: 8px 16px;
            border: none;
            background: #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .bio-tab.active {
            background: #4CAF50;
            color: white;
        }
        .bio-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .bio-save-btn {
            padding: 8px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .bio-save-btn:hover {
            background: #43a047;
        }
        .bio-save-btn:disabled {
            background: #a5d6a7;
            cursor: not-allowed;
        }
        .bio-edit-btn {
            padding: 8px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .bio-edit-btn:hover {
            background: #1976D2;
        }
        .no-bio {
            color: #9ca3af;
            font-style: italic;
        }
        .group-info {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }
        .group-info p {
            margin: 8px 0;
            color: #4b5563;
        }
        .problem-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .problem-tag {
            background: #e8f5e9;
            color: #4CAF50;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .problem-tag:hover {
            background: #c8e6c9;
            transform: translateY(-1px);
        }
        .no-data {
            color: #9ca3af;
            font-style: italic;
            padding: 16px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }
        thead tr {
            background: #f3f4f6;
        }
        th {
            padding: 12px 16px;
            text-align: left;
            color: #4b5563;
            font-weight: 600;
            border-bottom: 2px solid #e5e7eb;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #4b5563;
        }
        tbody tr:hover {
            background: #f9fafb;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        a {
            color: #4CAF50;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page-container">
      <nav class="navbar">
        <a href="/problemlist" class="navbar-brand">
          <span class="logo">G</span>
          <span>Gooj</span>
        </a>
        <div class="navbar-links">
          <a href="/problemlist">题目列表</a>
          <a href="/user_profile" class="active">用户信息</a>
          <a href="/contest">比赛</a>
          <a href="/submissions">提交记录</a>
          <a href="/ranking">排行榜</a>
        </div>
        <div class="navbar-user">
          <span class="username" id="navbarUser">加载中...</span>
          <span class="rating-badge" id="navbarRating">1500</span>
          <button onclick="logout()">登出</button>
        </div>
      </nav>

      <div id="manageUsersOption" style="display:none;margin-bottom:16px">
        <a href="/manage" class="button primary">管理用户</a>
      </div>

      <div class="card">
        <div class="profile-header">
            <div class="avatar" id="avatar">?</div>
            <div class="user-info">
                <h1 id="username">加载中...</h1>
                <div class="user-meta">
                    <span id="group">用户组: ...</span>
                    <span id="role">角色: ...</span>
                    <span class="rating" id="rating">Rating: ...</span>
                    <button id="resetPwBtn" style="display:none; padding:4px 12px; font-size:13px; background:#f59e0b; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="resetPassword()">重置密码</button>
                    <button id="changePwBtn" style="display:none; padding:4px 12px; font-size:13px; background:#4CAF50; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="openChangePw()">修改密码</button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="solved-count">0</div>
                <div class="stat-label">通过题目</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-sub">0</div>
                <div class="stat-label">总提交</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="ac-sub">0</div>
                <div class="stat-label">通过提交</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="ac-rate">0%</div>
                <div class="stat-label">通过率</div>
            </div>
        </div>

        <div class="section">
            <h2>用户组信息</h2>
            <div class="group-info" id="group-info">
                <p>用户组: <span id="group-name">-</span></p>
                <p>注册时间: <span id="created-at">-</span></p>
            </div>
        </div>

        <div class="section" id="bio-section" style="display:none;">
            <h2>个人简介</h2>
            <div class="bio-container">
                <div id="bio-view" style="display:none;">
                    <div id="bio-display" class="bio-preview"></div>
                    <div class="bio-actions">
                        <button class="bio-edit-btn" id="bio-edit-btn" onclick="showBioEdit()">编辑简介</button>
                    </div>
                </div>
                <div id="bio-edit-container" style="display:none;">
                    <div class="bio-tabs">
                        <button class="bio-tab active" id="tab-edit" onclick="showTab('edit')">编辑</button>
                        <button class="bio-tab" id="tab-preview" onclick="showTab('preview')">预览</button>
                    </div>
                    <textarea id="bio-editor" class="bio-editor" placeholder="在这里编辑你的个人简介（支持Markdown格式）..."></textarea>
                    <div id="bio-preview" class="bio-preview" style="display:none;"></div>
                    <div class="bio-actions">
                        <button class="bio-save-btn" id="bio-save-btn" onclick="saveBio()">保存</button>
                        <button class="bio-tab" onclick="cancelBioEdit()">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>通过的题目</h2>
            <div class="problem-list" id="solved-problems">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="section">
            <h2>比赛记录</h2>
            <div id="contest-history">
                <div class="loading">加载中...</div>
            </div>
        </div>
      </div>
    </div>

    <script>
        // Get username from URL path (decode to handle non-ASCII usernames)
        const pathParts = window.location.pathname.split('/');
        const username = decodeURIComponent(pathParts[pathParts.length - 1]) || 'Unknown';
        
        // Debug: show current values
        console.log('URL username:', username);
        console.log('localStorage username:', localStorage.getItem('username'));

        // Update avatar with first letter
        document.getElementById('avatar').textContent = username.charAt(0).toUpperCase();

        // Fetch user profile data
        fetch(`/api/user/${username}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('User not found');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('username').textContent = data.username;
                document.getElementById('group').textContent = '用户组: ' + (data.group_name || '无');
                document.getElementById('role').textContent = '角色: ' + (data.role || 'user');
                document.getElementById('rating').textContent = 'Rating: ' + (data.rating || 1500);
                document.getElementById('solved-count').textContent = data.solved_count;
                document.getElementById('total-sub').textContent = data.total_submissions;
                document.getElementById('ac-sub').textContent = data.accepted_submissions;
                document.getElementById('group-name').textContent = data.group_name || '无';
                document.getElementById('created-at').textContent = data.created_at;

                // Calculate AC rate
                const rate = data.total_submissions > 0 
                    ? ((data.accepted_submissions / data.total_submissions) * 100).toFixed(1) 
                    : 0;
                document.getElementById('ac-rate').textContent = rate + '%';

                // Load solved problems
                loadSolvedProblems(username);

                // Load contest history
                loadContestHistory(data.contests);
            })
            .catch(error => {
                document.getElementById('username').textContent = '用户不存在';
                console.error('Error:', error);
            });

        function loadSolvedProblems(username) {
            fetch(`/api/user/${username}/solved`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('solved-problems');
                    if (data.solved_ids && data.solved_ids.length > 0) {
                        container.innerHTML = data.solved_ids.map(id =>
                            `<a href="/problem?id=${id}" class="problem-tag">${id}</a>`
                        ).join('');
                    } else {
                        container.innerHTML = '<p class="no-data">暂无通过题目</p>';
                    }
                })
                .catch(error => {
                    document.getElementById('solved-problems').innerHTML =
                        '<p class="no-data">加载失败</p>';
                });
        }

        function loadContestHistory(contests) {
            const container = document.getElementById('contest-history');
            if (!contests || contests.length === 0) {
                container.innerHTML = '<p class="no-data">暂无比赛记录</p>';
                return;
            }

            const html = '<table style="width:100%;border-collapse:collapse;">' +
                '<thead>' +
                '<tr style="background:#f5f5f5;text-align:left;">' +
                '<th style="padding:10px;border:1px solid #ddd;">比赛名称</th>' +
                '<th style="padding:10px;border:1px solid #ddd;">排名</th>' +
                '<th style="padding:10px;border:1px solid #ddd;">总分</th>' +
                '<th style="padding:10px;border:1px solid #ddd;">Rating变化</th>' +
                '</tr>' +
                '</thead>' +
                '<tbody>' +
                contests.map(c => {
                    const ratingClass = c.rating_change > 0 ? 'color:#4CAF50;' : (c.rating_change < 0 ? 'color:#f44336;' : 'color:#666;');
                    const ratingSign = c.rating_change > 0 ? '+' : '';
                    return '<tr>' +
                        `<td style="padding:10px;border:1px solid #ddd;"><a href="/contest?id=${c.contest_id}">${c.contest_name}</a></td>` +
                        `<td style="padding:10px;border:1px solid #ddd;">${c.rank}</td>` +
                        `<td style="padding:10px;border:1px solid #ddd;">${c.total_score}</td>` +
                        `<td style="padding:10px;border:1px solid #ddd;${ratingClass}">${ratingSign}${c.rating_change}</td>` +
                        '</tr>';
                }).join('') +
                '</tbody>' +
                '</table>';
            container.innerHTML = html;
        }

        // Show password buttons based on viewer vs profile owner
        function tryShowResetBtn() {
            const currentUser = localStorage.getItem('username');
            if (!currentUser) return;
            // "修改密码" (self-service) is only for the owner of this profile.
            if (currentUser === username) {
                document.getElementById('changePwBtn').style.display = 'inline-block';
            }
            // "重置密码" (admin) requires EditPermission, and makes sense for others.
            fetch('/api/user_permissions?username=' + encodeURIComponent(currentUser) + '&permission=EditPermission')
                .then(res => res.ok ? res.json() : { permited: false })
                .then(permData => {
                    if (permData.permited) {
                        document.getElementById('resetPwBtn').style.display = 'inline-block';
                        hasEditPermission = permData.permited;
                    }
                })
                .catch(() => {});
        }

        // Load user bio
        function loadBio() {
            const currentUser = localStorage.getItem('username');
            if (!currentUser) return;

            // Check permission: own profile or EditPermission
            fetch('/api/user_permissions?username=' + encodeURIComponent(currentUser) + '&permission=EditPermission')
                .then(res => res.ok ? res.json() : { permited: false })
                .then(permData => {
                    console.log('loadBio permData:', permData, 'currentUser:', currentUser, 'username:', username);
                    if (permData.permited || currentUser === username) {
                        document.getElementById('bio-section').style.display = 'block';
                        hasEditPermission = permData.permited;
                        fetchBio();
                    }
                })
                .catch(e => console.error('loadBio error:', e));
        }

        function fetchBio() {
            fetch('/api/user/' + encodeURIComponent(username) + '/bio')
                .then(res => {
                    if (!res.ok) {
                        console.error('fetchBio failed:', res.status, res.statusText);
                        return { bio: '' };
                    }
                    return res.json();
                })
                .then(data => {
                    const bioDisplay = document.getElementById('bio-display');
                    const bioView = document.getElementById('bio-view');
                    const bioEditContainer = document.getElementById('bio-edit-container');
                    const currentUser = localStorage.getItem('username');
                    const canEdit = currentUser === username || hasEditPermission;

                    if (data.bio && data.bio.trim()) {
                        bioDisplay.innerHTML = simpleMarkdown(data.bio);
                    } else {
                        bioDisplay.innerHTML = '<p class="no-bio">暂无个人简介</p>';
                    }
                    
                    // Render LaTeX math
                    if (typeof renderMathInElement !== 'undefined') {
                        renderMathInElement(bioDisplay, {
                            delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '$', right: '$', display: false},
                                {left: '\\(', right: '\\)', display: false},
                                {left: '\\[', right: '\\]', display: true}
                            ],
                            throwOnError: false
                        });
                    }

                    if (canEdit) {
                        document.getElementById('bio-edit-btn').style.display = 'inline-block';
                    }
                    bioView.style.display = 'block';
                    bioEditContainer.style.display = 'none';
                })
                .catch(e => console.error('fetchBio error:', e));
        }

        var hasEditPermission = false;

        function showBioEdit() {
            document.getElementById('bio-view').style.display = 'none';
            document.getElementById('bio-edit-container').style.display = 'block';
            document.getElementById('bio-editor').value = '';

            // Fetch current bio content
            fetch('/api/user/' + encodeURIComponent(username) + '/bio')
                .then(res => res.ok ? res.json() : { bio: '' })
                .then(data => {
                    document.getElementById('bio-editor').value = data.bio || '';
                })
                .catch(() => {});

            showTab('edit');
        }

        function showTab(tab) {
            const isEdit = tab === 'edit';
            document.getElementById('tab-edit').classList.toggle('active', isEdit);
            document.getElementById('tab-preview').classList.toggle('active', !isEdit);
            document.getElementById('bio-editor').style.display = isEdit ? 'block' : 'none';
            document.getElementById('bio-preview').style.display = isEdit ? 'none' : 'block';

            if (!isEdit) {
                // Update preview
                const bio = document.getElementById('bio-editor').value;
                const previewEl = document.getElementById('bio-preview');
                previewEl.innerHTML = simpleMarkdown(bio) || '<p class="no-bio">预览为空</p>';
                // Render LaTeX math in preview
                if (typeof renderMathInElement !== 'undefined') {
                    renderMathInElement(previewEl, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            }
        }

        function cancelBioEdit() {
            document.getElementById('bio-view').style.display = 'block';
            document.getElementById('bio-edit-container').style.display = 'none';
        }

        async function saveBio() {
            const bio = document.getElementById('bio-editor').value;
            const saveBtn = document.getElementById('bio-save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';

            try {
                const res = await fetch('/api/user/' + encodeURIComponent(username) + '/bio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bio })
                });
                if (!res.ok) throw new Error(await res.text());
                alert('简介已保存');
                fetchBio();
                cancelBioEdit();
            } catch (e) {
                alert('保存失败：' + e.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存';
            }
        }

        // Simple markdown parser for preview
        function simpleMarkdown(text) {
            if (!text) return '';
            
            // First extract and protect code blocks
            let codeBlocks = [];
            let codeBlockRegex = /```[\s\S]*?```/g;
            text = text.replace(codeBlockRegex, function(match) {
                codeBlocks.push(match);
                return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
            });
            
            // Process tables first - split by lines and parse table structure
            let lines = text.split('\n');
            let result = [];
            let inTable = false;
            let tableLines = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                const isSeparator = /^\|[-:\s]+\|$/.test(line);
                
                if (line.startsWith('|') && line.endsWith('|') && !isSeparator) {
                    // Potential table row
                    if (!inTable) {
                        inTable = true;
                        tableLines = [];
                    }
                    tableLines.push(line);
                } else if (isSeparator) {
                    // Separator line - part of table
                    if (inTable) {
                        tableLines.push(line); // Keep for validation
                    }
                } else {
                    // Non-table line
                    if (inTable && tableLines.length >= 2) {
                        // Finish processing table
                        result.push(parseTableMarkdown(tableLines));
                        tableLines = [];
                    }
                    inTable = false;
                    result.push(line);
                }
            }
            
            // Handle remaining table at end
            if (inTable && tableLines.length >= 2) {
                result.push(parseTableMarkdown(tableLines));
            }
            
            // Now process markdown on non-table lines
            let html = result.map(line => {
                if (line.isTable) return line.html;
                return processMarkdownLine(line);
            }).join('<br>');
            
            // Restore code blocks
            codeBlocks.forEach((block, i) => {
                // Convert markdown code block to HTML
                const codeContent = block.slice(3, -3).replace(/^\n|\n$/g, '');
                html = html.replace(`__CODE_BLOCK_${i}__`, `<pre><code>${escapeHtml(codeContent)}</code></pre>`);
            });
            
            return html;
        }
        
        function parseTableMarkdown(lines) {
            // First line is header, second is separator, rest are body
            const headerLine = lines[0];
            const bodyLines = lines.slice(2); // Skip separator line
            
            const headers = headerLine.split('|').slice(1, -1).map(h => h.trim());
            
            let table = '<table class="md-table"><thead><tr>';
            headers.forEach(h => { table += `<th>${escapeHtml(h)}</th>`; });
            table += '</tr></thead><tbody>';
            
            bodyLines.forEach(rowLine => {
                const cells = rowLine.split('|').slice(1, -1).map(c => c.trim());
                table += '<tr>';
                cells.forEach(cell => { table += `<td>${escapeHtml(cell)}</td>`; });
                // Fill empty cells if row is shorter than header
                for (let i = cells.length; i < headers.length; i++) {
                    table += '<td></td>';
                }
                table += '</tr>';
            });
            
            table += '</tbody></table>';
            return { isTable: true, html: table };
        }
        
        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
        
        function processMarkdownLine(line) {
            // Skip table placeholder (already processed)
            if (line.startsWith('__CODE_BLOCK_')) {
                return line; // Will be replaced later
            }
            
            let html = escapeHtml(line);
            
            // Headers
            html = html
                .replace(/^### (.+)$/, '<h3>$1</h3>')
                .replace(/^## (.+)$/, '<h2>$1</h2>')
                .replace(/^# (.+)$/, '<h1>$1</h1>');
            
            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Italic
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            // Inline code
            html = html.replace(/`(.+?)`/g, '<code>$1</code>');
            
            return html;
        }

        async function resetPassword() {
            if (!confirm(`确定要重置用户 ${username} 的密码吗？`)) return;
            try {
                const res = await fetch('/api/reset_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                alert(`密码已重置，新密码是：\n${data.password}\n请告知用户。`);
            } catch (e) {
                alert('重置失败：' + e.message);
            }
        }

        tryShowResetBtn();
        loadBio();
    </script>

    <!-- Change password modal (self service) -->
    <div id="changePwModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:24px; border-radius:12px; width:320px; max-width:90%;">
            <h3 style="margin-top:0;">修改密码</h3>
            <label style="display:block; margin:12px 0 4px; font-size:13px;">当前密码</label>
            <input id="oldPw" type="password" style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:6px; box-sizing:border-box;">
            <label style="display:block; margin:12px 0 4px; font-size:13px;">新密码（至少6位）</label>
            <input id="newPw" type="password" style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:6px; box-sizing:border-box;">
            <label style="display:block; margin:12px 0 4px; font-size:13px;">确认新密码</label>
            <input id="newPw2" type="password" style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:6px; box-sizing:border-box;">
            <div id="changePwMsg" style="color:#dc3545; font-size:13px; min-height:18px; margin-top:8px;"></div>
            <div style="display:flex; gap:8px; margin-top:12px; justify-content:flex-end;">
                <button onclick="closeChangePw()" style="padding:8px 16px; background:#e5e7eb; border:none; border-radius:6px; cursor:pointer;">取消</button>
                <button id="changePwSubmit" onclick="submitChangePw()" style="padding:8px 16px; background:#4CAF50; color:white; border:none; border-radius:6px; cursor:pointer;">保存</button>
            </div>
        </div>
    </div>

    <script>
        function openChangePw() {
            document.getElementById('oldPw').value = '';
            document.getElementById('newPw').value = '';
            document.getElementById('newPw2').value = '';
            document.getElementById('changePwMsg').textContent = '';
            document.getElementById('changePwModal').style.display = 'flex';
        }
        function closeChangePw() {
            document.getElementById('changePwModal').style.display = 'none';
        }
        async function submitChangePw() {
            const oldPw = document.getElementById('oldPw').value;
            const newPw = document.getElementById('newPw').value;
            const newPw2 = document.getElementById('newPw2').value;
            const msg = document.getElementById('changePwMsg');
            const btn = document.getElementById('changePwSubmit');
            if (newPw.length < 6) { msg.textContent = '新密码至少6位'; return; }
            if (newPw !== newPw2) { msg.textContent = '两次输入的新密码不一致'; return; }
            btn.disabled = true; btn.textContent = '保存中...';
            try {
                const res = await fetch('/api/change_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: oldPw, new_password: newPw })
                });
                if (!res.ok) {
                    const t = await res.text();
                    msg.textContent = '修改失败：' + t;
                } else {
                    alert('密码修改成功');
                    closeChangePw();
                }
            } catch (e) {
                msg.textContent = '修改失败：' + e.message;
            } finally {
                btn.disabled = false; btn.textContent = '保存';
            }
        }
    </script>
</body>
